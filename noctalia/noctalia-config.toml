[bar]
order = [ "default" ]

    [bar.default]
    background_opacity = 0.89999997988343239
    center = [ "notifications", "clock", "media" ]
    end = [ "tray", "network", "bluetooth", "battery", "session" ]
    margin_ends = 0
    padding = 10
    radius = 0
    shadow = false
    start = [ "wallpaper", "workspaces", "active_window" ]
    thickness = 30

[desktop_widgets]
enabled = false

[dock]
auto_hide = true
background_opacity = 0
border_width = 0.0
concave_edge_corners = false
cross_axis_padding = 30
enabled = false
inactive_opacity = 0.99999997764825821
item_spacing = 0
pinned = [
    "brave-browser",
    "md.obsidian.Obsidian",
    "com.spotify.Client",
    "com.mitchellh.ghostty",
    "lens",
    "io.dbeaver.DBeaverCommunity",
    "postman",
    "com.microsoft.VSCode",
    "idea"
]
radius = 0
reserve_space = false
shadow = false
show_dots = true

    [dock.monitor.eDP-1]
    enabled = true

[lockscreen]
fingerprint = false
monitors = [ "eDP-1" ]

[lockscreen_widgets]
enabled = true
schema_version = 2
widget_order = [
    "lockscreen-login-box@eDP-1",
    "lockscreen-login-box@HDMI-A-1",
    "lockscreen-widget-0000000000000001",
    "lockscreen-widget-0000000000000002"
]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@HDMI-A-1"]
    box_height = 196.0
    box_width = 810.0
    cx = 720.0
    cy = 718.0
    output = "HDMI-A-1"
    placement_height = 900.0
    placement_width = 1440.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@HDMI-A-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_password_reveal = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

    [lockscreen_widgets.widget."lockscreen-login-box@eDP-1"]
    box_height = 70.0
    box_width = 240.0
    cx = 960.0
    cy = 572.0
    output = "eDP-1"
    placement_height = 1080.0
    placement_width = 1920.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@eDP-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.0
        background_radius = 32.0
        center_password_text = true
        input_opacity = 0.5
        input_radius = 32.0
        layout = "compact"
        show_caps_lock = false
        show_keyboard_layout = false
        show_login_button = false
        show_media = true
        show_password_reveal = false
        show_session_buttons = true
        show_unlock_hint = false
        show_weather = false

    [lockscreen_widgets.widget.lockscreen-widget-0000000000000001]
    box_height = 96.0
    box_width = 240.0
    cx = 960.0
    cy = 468.0
    output = "eDP-1"
    placement_height = 1080.0
    placement_width = 1920.0
    rotation = -0.0
    type = "clock"

        [lockscreen_widgets.widget.lockscreen-widget-0000000000000001.settings]
        background_opacity = 0.0
        background_padding = 0
        background_radius = 0
        clock_style = "digital"
        format = "{:%I:%M}"
        shadow = false
        timezone = "America/Guayaquil"

    [lockscreen_widgets.widget.lockscreen-widget-0000000000000002]
    box_height = 48.0
    box_width = 336.0
    cx = 960.0
    cy = 516.0
    output = "eDP-1"
    placement_height = 1080.0
    placement_width = 1920.0
    rotation = 0.0
    type = "clock"

        [lockscreen_widgets.widget.lockscreen-widget-0000000000000002.settings]
        background_opacity = 0.0
        center_text = true
        format = "{:%A, %b %d}"
        shadow = false

[shell]
avatar_path = "/home/grizz/Pictures/avatar.jpeg"
corner_radius_scale = 2.0
font_family = "JetBrains Mono SemiBold"
polkit_agent = true
popup_shadows = false

    [shell.animation]
    enabled = false
    speed = 0.10000000149011612

    [shell.launcher]
    categories = false
    compact = true
    fetch_exchange_rates = false
    show_app_origin_indicator = false

        [shell.launcher.providers.calculator]
        global = false

    [shell.panel]
    session_placement = "floating"
    session_position = "center"

    [shell.screenshot]
    directory = "/home/grizz/Pictures"

[theme]
builtin = "Catppuccin"
community_palette = "Oxide"
custom_palette = "background-mc"
mode = "dark"
shell_mode = "dark"
source = "wallpaper"
wallpaper_scheme = "m3-monochrome"

    [theme.templates]
    enable_builtin_templates = false
    enable_community_templates = false

[wallpaper]
directory = "/home/grizz/Pictures/Wallpapers"
transition = [ "disc", "fade", "honeycomb", "stripes", "wipe", "zoom" ]

    [wallpaper.automation]
    enabled = true

    [wallpaper.default]
    path = "/home/grizz/Pictures/Wallpapers/wallhaven-216yqx.jpg"

    [wallpaper.last]
    path = "/home/grizz/Pictures/Wallpapers/wallhaven-216yqx.jpg"

    [wallpaper.monitors.HDMI-A-1]
    path = "/home/grizz/Pictures/background.jpg"

    [wallpaper.monitors.eDP-1]
    path = "/home/grizz/Pictures/Wallpapers/wallhaven-216yqx.jpg"

[weather]
enabled = false

[widget.active_window]
max_length = 400

[widget.battery]
display_mode = "graphic"
hide_when_full = true
hide_when_plugged = true
scale = 0.75
show_label = false

[widget.brightness]
show_label = false

[widget.clock]
format = "{:%b %d %-I:%M}"

[widget.control-center]
glyph = "apps-filled"

[widget.media]
max_length = 250

[widget.network]
show_label = false

[widget.tray]
hidden = [ "network" ]
hide_passive = false

[widget.volume]
show_label = false

[widget.wallpaper]
custom_image = "/usr/share/icons/arch_logo.svg"

[widget.workspaces]
hide_when_empty = true
style = "minimal"
